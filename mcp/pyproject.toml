[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gkod-mcp"
version = "0.1.0"
description = "MCP server for GKod: compile, check and look at 3D-printable parts written as OpenSCAD"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[tool.setuptools]
packages = ["gkod_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
