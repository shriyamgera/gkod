name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The private working copy of this repo has no Pages site; only the public repo deploys.
    if: github.repository == 'shriyamgera/gkod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore OpenSCAD web build
        id: openscad
        uses: actions/cache@v6
        with:
          path: app/public/openscad
          key: openscad-${{ hashFiles('scripts/fetch-openscad.sh') }}

      - name: Fetch OpenSCAD web build
        if: steps.openscad.outputs.cache-hit != 'true'
        run: npm run fetch:openscad

      # The script holds the pinned commit and its sha256; the lock file pins the libraries it bundles.
      - name: Restore Kiri:Moto engine build
        id: kiri
        uses: actions/cache@v6
        with:
          path: app/public/kiri
          key: kiri-${{ hashFiles('scripts/fetch-kiri.sh', 'scripts/kiri/**') }}

      - name: Build Kiri:Moto engine
        if: steps.kiri.outputs.cache-hit != 'true'
        run: npm run fetch:kiri

      - run: npm test
      - run: npm run build

      - name: Check the OpenSCAD files are in the site
        run: test -s app/dist/openscad/openscad.js && test -s app/dist/openscad/openscad.wasm

      - name: Check the Kiri:Moto files are in the site
        run: |
          for f in kiri-eng.js kiri-work.js kiri-pool.js wasm/manifold.wasm wasm/kiri-geo.wasm LICENSE-kiri-moto.md LICENSES.txt; do
            test -s "app/dist/kiri/$f" || { echo "missing app/dist/kiri/$f"; exit 1; }
          done

      # The same slicer checks as CI, so a broken slicer or printer profile never reaches the live site.
      - run: npm run e2e

      - name: Slice for every printer and check the G-code
        run: npm run slice:printers

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
