name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore OpenSCAD web build
        id: openscad
        uses: actions/cache@v6
        with:
          path: app/public/openscad
          key: openscad-${{ hashFiles('scripts/fetch-openscad.sh') }}

      - name: Fetch OpenSCAD web build
        if: steps.openscad.outputs.cache-hit != 'true'
        run: npm run fetch:openscad

      - run: npm test
      - run: npm run build

      - name: Check the OpenSCAD files are in the site
        run: test -s app/dist/openscad/openscad.js && test -s app/dist/openscad/openscad.wasm

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
