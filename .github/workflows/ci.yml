name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The script holds the pinned version and its sha256, so its hash is the cache key.
      - name: Restore OpenSCAD web build
        id: openscad
        uses: actions/cache@v6
        with:
          path: app/public/openscad
          key: openscad-${{ hashFiles('scripts/fetch-openscad.sh') }}

      - name: Fetch OpenSCAD web build
        if: steps.openscad.outputs.cache-hit != 'true'
        run: npm run fetch:openscad

      # The script holds the pinned commit and its sha256; the lock file pins the libraries it bundles.
      - name: Restore Kiri:Moto engine build
        id: kiri
        uses: actions/cache@v6
        with:
          path: app/public/kiri
          key: kiri-${{ hashFiles('scripts/fetch-kiri.sh', 'scripts/kiri/**') }}

      - name: Build Kiri:Moto engine
        if: steps.kiri.outputs.cache-hit != 'true'
        run: npm run fetch:kiri

      - run: npm run typecheck

      # The print checks run the same tests in Node and in the runner's own Chrome.
      - name: Show the Chrome used by the browser tests
        run: google-chrome --version

      - run: npm test

      - name: Run the print checks command on the example parts
        run: npx gkod-check checks/test/fixtures/*.stl

      - run: npm run build

      - name: Check the OpenSCAD and Kiri:Moto files are in the site
        run: |
          for f in openscad/openscad.js openscad/openscad.wasm kiri/kiri-eng.js kiri/kiri-work.js kiri/kiri-pool.js kiri/wasm/manifold.wasm kiri/wasm/kiri-geo.wasm kiri/LICENSE-kiri-moto.md kiri/LICENSES.txt; do
            test -s "app/dist/$f" || { echo "missing app/dist/$f"; exit 1; }
          done

      # Opens the test cube in the built site, slices it for the Kobra 2 Neo in Chrome, downloads the G-code and
      # checks the file.
      - run: npm run e2e

      # Slices the example parts and a 20 mm cube for every printer in the picker, in headless Chrome against a
      # production build, then checks every G-code file again in Node. Any failed check fails the run.
      - name: Slice for every printer and check the G-code
        run: npm run slice:printers
