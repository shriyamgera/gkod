name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # the benchmark tests took about 1 minute on main and 3 to 5 on day 8 (learning-curve tests, two more compiles per
    # scored answer), on top of the site's tests, the browser tests and slicing for every printer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The script holds the pinned version and its sha256, so its hash is the cache key.
      - name: Restore OpenSCAD web build
        id: openscad
        uses: actions/cache@v6
        with:
          path: app/public/openscad
          key: openscad-${{ hashFiles('scripts/fetch-openscad.sh') }}

      - name: Fetch OpenSCAD web build
        if: steps.openscad.outputs.cache-hit != 'true'
        run: npm run fetch:openscad

      # The script holds the pinned commit and its sha256; the lock file pins the libraries it bundles.
      - name: Restore Kiri:Moto engine build
        id: kiri
        uses: actions/cache@v6
        with:
          path: app/public/kiri
          key: kiri-${{ hashFiles('scripts/fetch-kiri.sh', 'scripts/kiri/**') }}

      - name: Build Kiri:Moto engine
        if: steps.kiri.outputs.cache-hit != 'true'
        run: npm run fetch:kiri

      - run: npm run typecheck

      # The print checks run the same tests in Node and in the runner's own Chrome.
      - name: Show the Chrome used by the browser tests
        run: google-chrome --version

      - run: npm test

      - name: Run the print checks command on the example parts
        run: npx gkod-check checks/test/fixtures/*.stl

      - run: npm run build

      - name: Check the OpenSCAD and Kiri:Moto files are in the site
        run: |
          for f in openscad/openscad.js openscad/openscad.wasm kiri/kiri-eng.js kiri/kiri-work.js kiri/kiri-pool.js kiri/wasm/manifold.wasm kiri/wasm/kiri-geo.wasm kiri/LICENSE-kiri-moto.md kiri/LICENSES.txt; do
            test -s "app/dist/$f" || { echo "missing app/dist/$f"; exit 1; }
          done

      # Opens the test cube in the built site, slices it for the Kobra 2 Neo in Chrome, downloads the G-code and
      # checks the file.
      - run: npm run e2e

      # Slices the example parts and a 20 mm cube for every printer in the picker, in headless Chrome against a
      # production build, then checks every G-code file again in Node. Any failed check fails the run.
      - name: Slice for every printer and check the G-code
        run: npm run slice:printers

      # The MCP server is Python; its tests call the gkod command, so they run after the Node steps.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            mcp/requirements-dev.txt
            bridge/requirements-dev.txt
            ml/requirements-dev.txt

      - name: Test the MCP server
        run: |
          python -m pip install -r mcp/requirements-dev.txt -e mcp
          python -m pytest -q mcp

      # The bridge's tests use a fake claude command, so no Claude Code login or plan is needed here.
      - name: Test the Claude Code bridge
        run: |
          python -m pip install -r bridge/requirements-dev.txt -e bridge
          python -m pytest -q bridge

      # The benchmark harness: the scorer on hand-made meshes and code, the extractor, the intervals, resuming a row
      # and the closed test split. The frozen sets are not in the repo and mlx runs only on Apple chips, so the tests
      # that need them skip here.
      - name: Test the benchmark harness
        run: |
          python -m pip install -r ml/requirements-dev.txt -e ml/bench
          python -m pytest -q ml/bench

      # The training code: the row builder on a hand-made set (with the site's wording through the gkod command), the
      # selection rules, the trainer's plan and the checkpoint rules. The tiny-model training tests need mlx, the
      # real-tokenizer test needs the model's files and the night-run tests need macOS, so those skip here.
      - name: Test the training code
        run: python -m pytest -q ml/train

  # The backend: its tests against a real PostgreSQL with pgvector, then the same stack in Docker Compose.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: gkod
          POSTGRES_PASSWORD: gkod-ci
          POSTGRES_DB: gkod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U gkod -d gkod"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://gkod:gkod-ci@localhost:5432/gkod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install the API and its test tools
        run: python -m pip install -r api/requirements-dev.txt -e api

      - name: Apply the migrations
        run: python -m gkod_api.migrate

      # The database tests make and drop their own databases on this server.
      - name: Test the loader, the migrations and the API
        run: python -m pytest -q api

      # The service container above holds port 5432, so the compose database is published on 5433.
      - name: Build the API image and start the stack with Docker Compose
        env:
          GKOD_DB_PORT: '5433'
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Check /health, load the fixture run and read it back
        run: |
          curl -fsS http://127.0.0.1:8000/health
          echo
          DATABASE_URL=postgresql://gkod:gkod-local-dev@127.0.0.1:5433/gkod \
            python -m gkod_api.load api/tests/fixtures/parts/fixture-run/parts.jsonl
          curl -fsS http://127.0.0.1:8000/stats \
            | python -c "import json, sys; s = json.load(sys.stdin); assert s['total'] == 8, s; print('stats ok')"
          curl -fsS "http://127.0.0.1:8000/parts?family=plate&checks_ok=false" \
            | python -c "import json, sys; p = json.load(sys.stdin); assert p['total'] == 1, p; print('parts ok')"

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
